version: 2

project_name: abolqasem

before:
  hooks:
    - go mod tidy
    - sh scripts/prepare-web-assets.sh
    - go test ./...

builds:
  - id: abolqasem
    main: ./cmd/abolqasem
    binary: abolqasem
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X ai-agent-manager/internal/buildinfo.Version={{ .Version }}

archives:
  - id: default
    name_template: "{{ .ProjectName }}-{{ .Os }}-{{ .Arch }}"
    format_overrides:
      - goos: windows
        format: zip
    files:
      - README.md
      - scripts/install-release.sh
      - scripts/install-release.ps1

checksum:
  name_template: "checksums.txt"

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
