version: 2

project_name: abolqasem

# GoReleaser's own archives must not share the directory that the sidecar
# pre-build hook fills with runtime binaries.
dist: .goreleaser-dist

before:
  hooks:
    - go mod tidy
    - sh scripts/prepare-web-assets.sh
    - sh scripts/build-sidecar.sh --all
    - go test ./...

builds:
  - id: abolqasem
    main: ./cmd/abolqasem
    binary: abolqasem
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X abolqasem/internal/buildinfo.Version={{ .Version }}

archives:
  - id: default
    name_template: "{{ .ProjectName }}-{{ .Os }}-{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - README.md
      - scripts/install-release.sh
      - scripts/install-release.ps1
      - src: "dist/sidecars/{{ .Os }}-{{ .Arch }}/codex-manager-gateway{{ if eq .Os \"windows\" }}.exe{{ end }}"
        dst: "."

checksum:
  name_template: "checksums.txt"

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
