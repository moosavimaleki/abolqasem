version: 2

project_name: ai-session-viewer

before:
  hooks:
    - go mod tidy
    - go test ./...

builds:
  - id: ai-session-viewer
    main: ./cmd/ai-session-viewer
    binary: ai-session-viewer
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w

archives:
  - id: default
    format_overrides:
      - goos: windows
        format: zip
    files:
      - README.md

checksum:
  name_template: "checksums.txt"

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
