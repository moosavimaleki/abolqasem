<!doctype html>
<html lang="en" dir="ltr" data-abolqasem-locale="default">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Abolqasem" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="96x96" href="./favicon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png" />
    <script>
      (() => {
        const root = document.documentElement
        const appearanceClasses = [
          "appearance-theme",
          "appearance-light",
          "appearance-theme-paper",
          "appearance-theme-sepia",
          "appearance-theme-night",
          "appearance-theme-charcoal",
          "appearance-theme-teal",
          "dark",
        ]

        function normalizeAppearanceTheme(value) {
          switch (value) {
            case "paper":
            case "sepia":
            case "night":
            case "charcoal":
            case "teal":
              return value
            case "abolqasem":
            case "dark":
              return "night"
            case "light":
              return "paper"
            default:
              return "night"
          }
        }

        function getAppearanceThemeClasses(theme) {
          const classes = ["appearance-theme"]
          if (theme === "paper") classes.push("appearance-light", "appearance-theme-paper")
          if (theme === "sepia") classes.push("appearance-theme-sepia")
          if (theme === "night") classes.push("appearance-theme-night")
          if (theme === "charcoal") classes.push("appearance-theme-charcoal")
          if (theme === "teal") classes.push("appearance-theme-teal")
          if (theme !== "paper") classes.push("dark")
          return classes
        }

        function applyAppearanceTheme(theme) {
          const resolvedTheme = normalizeAppearanceTheme(theme)
          root.classList.remove(...appearanceClasses)
          root.classList.add(...getAppearanceThemeClasses(resolvedTheme))
          root.style.colorScheme = resolvedTheme === "paper" ? "light" : "dark"
          return resolvedTheme
        }

        try {
          const serverLocale = root.dataset.abolqasemLocale === "server" ? root.lang : null
          const cachedLocale = window.localStorage.getItem("abolqasem:locale")
          const locale = serverLocale === "fa" || serverLocale === "en"
            ? serverLocale
            : cachedLocale === "fa" || cachedLocale === "en"
              ? cachedLocale
              : root.lang === "fa" || root.lang === "en"
                ? root.lang
                : "en"
          root.lang = locale
          root.dir = locale === "fa" ? "rtl" : "ltr"
          root.dataset.abolqasemLocale = serverLocale ? "server" : "bootstrap"
        } catch {
          root.lang = root.lang === "fa" ? "fa" : "en"
          root.dir = root.lang === "fa" ? "rtl" : "ltr"
        }

        function systemAppearanceTheme() {
          try {
            return window.matchMedia("(prefers-color-scheme: dark)").matches ? "night" : "paper"
          } catch {
            return "paper"
          }
        }

        let appearanceTheme = systemAppearanceTheme()
        try {
          const rawSettings = window.localStorage.getItem("abolqasem:reader-settings:v1")
            || window.localStorage.getItem("ai-agent-manager.abolqasem-reader-settings.v1")
          const parsedSettings = rawSettings ? JSON.parse(rawSettings) : null
          appearanceTheme = parsedSettings?.theme
            ? normalizeAppearanceTheme(parsedSettings.theme)
            : systemAppearanceTheme()
        } catch {
          appearanceTheme = systemAppearanceTheme()
        }

        const resolvedTheme = applyAppearanceTheme(appearanceTheme)
        const themeColor = (() => {
          switch (resolvedTheme) {
            case "paper":
              return "rgb(246, 241, 233)"
            case "sepia":
              return "rgb(30, 22, 21)"
            case "teal":
              return "rgb(4, 24, 22)"
            case "charcoal":
              return "rgb(15, 17, 21)"
            case "night":
            default:
              return "rgb(7, 16, 29)"
          }
        })()

        document.querySelector('meta[name="theme-color"]')?.setAttribute("content", themeColor)
        document
          .querySelector('meta[name="apple-mobile-web-app-status-bar-style"]')
          ?.setAttribute("content", resolvedTheme === "paper" ? "default" : "black-translucent")
      })()
    </script>
    <style>
      :root {
        --boot-bg-start: #07101d;
        --boot-bg-end: #111827;
        --boot-card-start: #1e293b;
        --boot-card-end: #0f172a;

      }

      html.appearance-theme-paper {

        --boot-card-start: #fffaf1;
        --boot-card-end: #ded2c1;

        --boot-accent: #b46a30;
        --boot-ring: rgba(33, 28, 23, 0.12);
      }

      html.appearance-theme-sepia {
        --boot-bg-start: #1f1715;
        --boot-bg-end: #32241f;
        --boot-card-start: #3b2b25;
        --boot-card-end: #201614;
        --boot-text: #f4dfc8;
        --boot-muted: #c8a98f;
        --boot-accent: #efb76d;
        --boot-ring: rgba(244, 223, 200, 0.12);
      }

      html.appearance-theme-charcoal {
        --boot-bg-start: #0f1115;
        --boot-bg-end: #1b1e24;
        --boot-card-start: #262b33;
        --boot-card-end: #11141a;
        --boot-text: #f5f7fa;
        --boot-muted: #9aa4b2;
        --boot-accent: #d9e2f0;
        --boot-ring: rgba(255, 255, 255, 0.1);
      }

      html.appearance-theme-teal {
        --boot-bg-start: #041816;
        --boot-bg-end: #082d29;
        --boot-card-start: #0d3a35;
        --boot-card-end: #05201d;
        --boot-text: #ecfffb;
        --boot-muted: #8ecac0;
        --boot-accent: #38e2c6;
        --boot-ring: rgba(236, 255, 251, 0.12);
      }

      html,
      body,
      #root {
        min-height: 100dvh;
      }

      body {
        margin: 0;
      }

      .abolqasem-boot-splash {
        min-height: 100dvh;
        display: grid;
        place-items: center;
        overflow: hidden;
        color: var(--boot-text);
        background:
          radial-gradient(circle at 50% 40%, color-mix(in srgb, var(--boot-accent) 18%, transparent), transparent 25rem),
          linear-gradient(135deg, var(--boot-bg-start), var(--boot-bg-end));
      }

      .abolqasem-boot-splash__inner {
        width: min(92vw, 560px);
        display: grid;
        place-items: center;
        text-align: center;
      }

      .abolqasem-boot-splash__card {
        width: 220px;
        height: 220px;
        display: grid;
        place-items: center;
        border-radius: 56px;
        position: relative;
        overflow: hidden;
        background: linear-gradient(180deg, var(--boot-card-start), var(--boot-card-end));
        box-shadow:
          0 24px 70px rgba(0, 0, 0, 0.36),
          inset 0 1px 0 rgba(255, 255, 255, 0.16),
          0 0 0 1px var(--boot-ring);
        transform: translateY(12px) scale(.92);
        opacity: 0;
        animation: abolqasem-boot-card-in 760ms cubic-bezier(.16, 1, .3, 1) 80ms forwards;
      }

      .abolqasem-boot-splash__card::after {
        content: "";
        position: absolute;
        inset: -40%;
        background: linear-gradient(115deg, transparent 35%, rgba(255, 255, 255, 0.24), transparent 65%);
        transform: translateX(80%) rotate(8deg);
        animation: abolqasem-boot-shine 1100ms ease-out 460ms forwards;
      }

      .abolqasem-boot-splash__logo {
        width: 166px;
        height: 166px;
        display: block;
        filter: drop-shadow(0 10px 20px rgba(0, 0, 0, 0.32));
        clip-path: inset(0 100% 0 0);
        animation: abolqasem-boot-logo-in 760ms cubic-bezier(.16, 1, .3, 1) 220ms forwards;
      }

      .abolqasem-boot-splash__brand {
        margin-top: 28px;
        opacity: 0;
        transform: translateY(10px);
        animation: abolqasem-boot-text-in 560ms ease-out 560ms forwards;
      }

      .abolqasem-boot-splash__title {
        margin: 0;
        font: 800 2.25rem/1.05 system-ui, sans-serif;
        letter-spacing: 0;
      }

      .abolqasem-boot-splash__subtitle {
        margin: 8px 0 0;
        font: 500 .95rem/1.5 system-ui, sans-serif;
        color: var(--boot-muted);
      }

      .abolqasem-boot-splash__loader {
        width: 172px;
        height: 3px;
        margin: 26px auto 0;
        border-radius: 999px;
        background: color-mix(in srgb, var(--boot-text) 14%, transparent);
        overflow: hidden;
      }

      .abolqasem-boot-splash__loader span {
        display: block;
        width: 45%;
        height: 100%;
        border-radius: inherit;
        background: linear-gradient(90deg, transparent, var(--boot-accent), transparent);
        animation: abolqasem-boot-load 1200ms ease-in-out 700ms infinite;
      }

      @keyframes abolqasem-boot-card-in {
        to { opacity: 1; transform: translateY(0) scale(1); }
      }

      @keyframes abolqasem-boot-logo-in {
        to { clip-path: inset(0 0 0 0); }
      }

      @keyframes abolqasem-boot-text-in {
        to { opacity: 1; transform: translateY(0); }
      }

      @keyframes abolqasem-boot-shine {
        to { transform: translateX(-80%) rotate(8deg); }
      }

      @keyframes abolqasem-boot-load {
        0% { transform: translateX(230%); }
        100% { transform: translateX(-230%); }
      }

      @media (prefers-reduced-motion: reduce) {
        .abolqasem-boot-splash__card,
        .abolqasem-boot-splash__logo,
        .abolqasem-boot-splash__brand,
        .abolqasem-boot-splash__loader span {
          animation: none;
        }

        .abolqasem-boot-splash__card,
        .abolqasem-boot-splash__brand {
          opacity: 1;
          transform: none;
        }

        .abolqasem-boot-splash__logo {
          clip-path: inset(0 0 0 0);
        }
      }
    </style>

    <div id="root">
      <div class="abolqasem-boot-splash" role="status" aria-label="Abolqasem loading">

          <section>
            <div class="abolqasem-boot-splash__card">
              <img class="abolqasem-boot-splash__logo" src="./abolqasem-logo.svg" alt="" />

            </div>
          </section>
        </main>
      </div>
    </div>
