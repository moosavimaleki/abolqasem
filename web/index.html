<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Codex RTL Viewer</title>
    <link rel="stylesheet" href="/styles.css">
</head>
<body>
    <div id="app">
        <aside id="sidebar">
            <div class="sidebar-header">
                <h2>Codex Sessions</h2>
            </div>
            <div id="sessions-list" class="sessions-list">
                <!-- Session items go here -->
            </div>
        </aside>
        <main id="chat-view">
            <div id="chat-header" class="chat-header">
                <h3 id="current-project-name">انتخاب یک سشن...</h3>
            </div>
            <div id="chat-messages" class="chat-messages">
                <!-- Messages go here -->
            </div>
        </main>
    </div>
    
    <!-- Notification Toast -->
    <div id="notification-toast" class="toast hidden">
        <p>سشن جدیدی فعال شد. تا <span id="toast-countdown">5</span> ثانیه دیگر منتقل می‌شوید.</p>
        <div class="toast-actions">
            <button id="toast-cancel">لغو</button>
            <button id="toast-go">همین الان برو</button>
        </div>
    </div>

    <script src="/app.js"></script>
</body>
</html>
