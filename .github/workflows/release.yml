name: release

on:
  workflow_dispatch:
  push:
    tags:
      - "*.*.*"

permissions:
  contents: write

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go: [stable]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}

      - run: gofmt -l . | tee /tmp/gofmt.out && test ! -s /tmp/gofmt.out
        if: runner.os != 'Windows'
      - run: gofmt -l . > gofmt.out; if ((Get-Content gofmt.out | Measure-Object -Line).Lines -gt 0) { Get-Content gofmt.out; exit 1 }
        if: runner.os == 'Windows'
      - run: go vet ./...
      - run: go test ./...
      - run: go build -trimpath -o dist/ai-agent-manager ./cmd/ai-agent-manager

  goreleaser:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
